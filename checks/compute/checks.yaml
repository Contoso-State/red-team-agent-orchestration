# Compute Platform Checks
# Executed by the Compute Platform Agent (VMs/VMSS, App Service, Functions).
# Containers & Kubernetes (AKS, ACR, Container Apps/Instances) live in checks/container/checks.yaml,
# owned by the Azure Container & Kubernetes Agent (aks-container).
# Conforms to schemas/check.schema.json.

- check_id: CHK-COMP-APPSVC-SECRETS-PLAINTEXT
  title: App Service/Function app secrets in plaintext settings
  domain: compute
  agent: compute-platform
  mode: read-only
  severity_default: High
  description: Application settings contain secret-shaped values (connection strings, keys) in plaintext instead of Key Vault references.
  detection:
    method: mcp-tool
    tool: "azure-appservice / azure-functionapp config appsettings list"
    logic: App setting value matches secret patterns and is not a @Microsoft.KeyVault reference.
  attack_vector: Config read access -> credential theft
  recommendation: Move secrets to Key Vault and use Key Vault references; use managed identity.
  controls:
    mitre: ["T1552.001"]
  required_permissions: ["Reader"]

- check_id: CHK-COMP-APPSVC-NO-AUTH
  title: App Service without authentication on sensitive content
  domain: compute
  agent: compute-platform
  mode: read-only
  severity_default: Medium
  description: Easy Auth is disabled on an app serving sensitive functionality.
  detection:
    method: mcp-tool
    tool: "azure-appservice auth settings"
    logic: authsettingsV2 disabled and app is internet-facing.
  attack_vector: Unauthenticated access to application
  recommendation: Enable App Service authentication or enforce app-level auth; add access restrictions.
  controls:
    mitre: ["T1190"]
  required_permissions: ["Reader"]

- check_id: CHK-COMP-APPSVC-FTP-DEBUG
  title: App Service FTP deployment or remote debugging enabled
  domain: compute
  agent: compute-platform
  mode: read-only
  severity_default: Medium
  description: Insecure deployment channels (FTP) or remote debugging are enabled.
  detection:
    method: mcp-tool
    tool: "azure-appservice config (ftpsState, remoteDebuggingEnabled)"
    logic: ftpsState == AllAllowed or remoteDebuggingEnabled == true.
  attack_vector: Weak deployment channel -> code injection
  recommendation: Set ftpsState to Disabled (or FtpsOnly); disable remote debugging.
  controls:
    mitre: ["T1190", "T1505"]
  required_permissions: ["Reader"]

- check_id: CHK-COMP-VM-NO-DISK-ENCRYPTION
  title: VM without disk encryption
  domain: compute
  agent: compute-platform
  mode: read-only
  severity_default: Medium
  description: A VM's disks are not encrypted with Azure Disk Encryption or encryption-at-host.
  detection:
    method: resource-graph
    tool: "virtualMachines + disks encryption settings"
    logic: No ADE and encryptionAtHost not enabled; or unmanaged disks.
  attack_vector: Disk/snapshot theft -> offline data access
  recommendation: Enable encryption-at-host or ADE; migrate to managed disks.
  controls:
    cis_azure: ["7.2", "7.3"]
    mitre: ["T1005"]
  required_permissions: ["Reader"]

- check_id: CHK-COMP-VM-PUBLIC-RUNCOMMAND
  title: Public VM with privileged managed identity and runCommand exposure
  domain: compute
  agent: compute-platform
  mode: read-only
  severity_default: High
  description: An internet-facing VM has a privileged managed identity, creating a high-value code-execution target.
  detection:
    method: resource-graph
    tool: "virtualMachines + publicIP + identity + role assignments"
    logic: VM has public IP and a managed identity holding Contributor/Owner.
  attack_vector: VM compromise -> managed identity privileges (chained)
  recommendation: Remove public IP, reduce identity privileges, restrict runCommand.
  controls:
    mitre: ["T1078.004", "T1651"]
  required_permissions: ["Reader"]
