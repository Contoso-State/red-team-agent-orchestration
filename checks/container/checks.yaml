# Azure Container & Kubernetes Checks
# Executed by the Azure Container & Kubernetes Agent (aks-container).
# Conforms to schemas/check.schema.json.
#
# Lane 1 (read-only, always on): mode: read-only — control-plane + Kubernetes-API reads only.
# Lane 2 (cluster-active, off by default, hard-gated): mode: cluster-active — runs ONLY under
#   engagement mode cluster-active-testing with an enabled, authorized cluster_testing block,
#   scope-locked to the Azure-derived cluster allowlist and enforced fail-closed by the cluster guardrail.
#
# CHK-COMP-* IDs below were re-homed from the compute domain (domain/agent flipped only) to preserve
# longitudinal scan history. New checks added by this agent use the CHK-CNTR-* prefix.

# ============================================================
# Lane 1 — read-only posture (re-homed from compute)
# ============================================================

- check_id: CHK-COMP-AKS-PUBLIC-API
  title: AKS API server publicly accessible
  domain: container
  agent: aks-container
  mode: read-only
  severity_default: High
  description: The AKS API server is reachable from the internet with no authorized IP ranges and is not a private cluster.
  detection:
    method: resource-graph
    tool: "managedClusters apiServerAccessProfile"
    logic: enablePrivateCluster is false and authorizedIPRanges is empty.
  attack_vector: Internet-exposed control plane -> credential attacks
  recommendation: Use a private cluster or restrict API access with authorized IP ranges.
  controls:
    cis_azure: ["8.x"]
    mitre: ["T1190"]
  required_permissions: ["Reader"]

- check_id: CHK-COMP-AKS-LOCAL-ADMIN
  title: AKS local accounts / admin kubeconfig enabled
  domain: container
  agent: aks-container
  mode: read-only
  severity_default: High
  description: AKS local accounts are enabled, allowing cluster-admin kubeconfig that bypasses Entra RBAC.
  detection:
    method: resource-graph
    tool: "managedClusters disableLocalAccounts"
    logic: disableLocalAccounts is false (or absent) on an Entra-integrated cluster.
  attack_vector: listClusterAdminCredential -> cluster admin bypassing identity controls
  recommendation: Set disableLocalAccounts=true and enforce Entra RBAC for Kubernetes.
  controls:
    mitre: ["T1078", "T1552.007"]
  required_permissions: ["Reader"]

- check_id: CHK-COMP-AKS-NO-NETPOL
  title: AKS cluster without network policy
  domain: container
  agent: aks-container
  mode: read-only
  severity_default: Medium
  description: The cluster has no network policy engine, leaving pod-to-pod traffic unrestricted.
  detection:
    method: resource-graph
    tool: "managedClusters networkProfile.networkPolicy"
    logic: networkPolicy is none/empty.
  attack_vector: Compromised pod -> unrestricted lateral movement
  recommendation: Enable Azure or Calico network policy and define deny-by-default policies.
  controls:
    mitre: ["T1021"]
  required_permissions: ["Reader"]

- check_id: CHK-COMP-AKS-NO-ENTRA-RBAC
  title: AKS cluster not integrated with Entra ID / Kubernetes RBAC
  domain: container
  agent: aks-container
  mode: read-only
  severity_default: High
  description: An AKS cluster does not use Entra ID integration with Azure RBAC for Kubernetes, relying on static Kubernetes RBAC or local accounts that are harder to govern and revoke.
  detection:
    method: resource-graph
    tool: "managedClusters aadProfile + enableRBAC + aadProfile.enableAzureRBAC"
    logic: enableRBAC is false, or aadProfile is absent, or aadProfile.enableAzureRBAC is false.
  attack_vector: Weak cluster authZ -> over-broad Kubernetes access, hard-to-revoke credentials
  recommendation: Enable Entra ID integration with Azure RBAC for Kubernetes; enable Kubernetes RBAC; disable local accounts.
  controls:
    mitre: ["T1078"]
  required_permissions: ["Reader"]

- check_id: CHK-COMP-AKS-OUTDATED-VERSION
  title: AKS running an unsupported or outdated Kubernetes version
  domain: container
  agent: aks-container
  mode: read-only
  severity_default: Medium
  description: The cluster (control plane or node pools) runs a Kubernetes version that is outside the AKS supported window or well behind the latest patch, exposing it to known CVEs and missing security fixes; node images may also be unpatched.
  detection:
    method: resource-graph
    tool: "managedClusters kubernetesVersion + agentPoolProfiles[].orchestratorVersion (compare with az aks get-versions)"
    logic: currentKubernetesVersion is below the oldest AKS-supported minor, or a node pool orchestratorVersion trails the control plane / latest available patch.
  attack_vector: Known CVE in unpatched control plane / kubelet -> exploitation for privilege escalation
  recommendation: Upgrade the control plane and node pools to a supported, patched Kubernetes version; enable auto-upgrade channel and node image auto-upgrade.
  controls:
    mitre: ["T1068", "T1190"]
    nist_csf: ["PR.PS-01", "ID.RA-01"]
  required_permissions: ["Reader"]

- check_id: CHK-COMP-AKS-NO-POD-SECURITY
  title: AKS Pod Security Standards not enforced / privileged pods allowed
  domain: container
  agent: aks-container
  mode: read-only
  severity_default: High
  description: Workload namespaces do not enforce Pod Security Admission (no baseline/restricted labels) and/or running pods use privileged security contexts, host namespaces, hostPath mounts, or run as root, removing the guardrails that prevent container escape to the node.
  detection:
    method: kube-api
    tool: "kubectl get ns -L pod-security.kubernetes.io/enforce + kubectl get pods -A -o json (read-only)"
    logic: A non-system namespace lacks a pod-security.kubernetes.io/enforce=baseline|restricted label, or a pod sets securityContext.privileged=true, hostNetwork/hostPID/hostIPC=true, a hostPath volume, or runAsNonRoot!=true.
  attack_vector: Privileged/host-namespaced pod -> escape to node -> cluster compromise
  recommendation: Label namespaces with pod-security.kubernetes.io/enforce=restricted (baseline at minimum); deny privileged, hostPath, and host namespaces via admission policy; require runAsNonRoot, drop ALL capabilities, and seccomp RuntimeDefault.
  controls:
    mitre: ["T1610", "T1611", "T1525"]
    nist_csf: ["PR.PS-01", "PR.PS-05", "PR.IR-01"]
  required_permissions: ["Reader"]

- check_id: CHK-COMP-AKS-RBAC-CLUSTER-ADMIN-SPRAWL
  title: AKS in-cluster Kubernetes RBAC cluster-admin sprawl
  domain: container
  agent: aks-container
  mode: read-only
  severity_default: High
  description: Inside an AKS cluster, Kubernetes RBAC grants cluster-admin (or wildcard verbs/resources) too broadly, or binds privileged ClusterRoles to system:authenticated / system:unauthenticated, collapsing tenant isolation and enabling privilege escalation and lateral movement.
  detection:
    method: kube-api
    tool: "kubectl get clusterrolebindings/clusterroles -o json (read-only; rbac-tool who-can optional)"
    logic: A ClusterRoleBinding references roleRef cluster-admin (or a custom ClusterRole with verbs=['*'] and resources=['*']) for non-system subjects, or any binding lists subject system:authenticated/system:unauthenticated; flag when cluster-admin principals exceed a small break-glass set.
  attack_vector: Over-broad in-cluster binding -> namespace breakout, secret theft, workload tampering
  recommendation: Scope access with namespaced Roles/RoleBindings; reserve cluster-admin for a minimal break-glass set; remove bindings to system:authenticated; drop wildcard ClusterRoles; integrate Entra groups via Azure RBAC for Kubernetes.
  controls:
    mitre: ["T1098.006", "T1078.004", "T1613"]
    nist_csf: ["PR.AA-05", "PR.IR-01"]
  required_permissions: ["Reader", "Microsoft.ContainerService/managedClusters/listClusterUserCredential/action (read kubeconfig)"]

- check_id: CHK-COMP-AKS-NODE-MI-EXPOSURE
  title: AKS workload identity disabled - pods exposed to node managed identity / IMDS
  domain: container
  agent: aks-container
  mode: read-only
  severity_default: High
  description: The cluster does not use Entra Workload Identity (OIDC issuer / workload identity webhook disabled), so pods reach the instance metadata endpoint and inherit the node pool's (kubelet/VMSS) managed identity, granting any compromised pod the node identity's Azure permissions.
  detection:
    method: resource-graph
    tool: "managedClusters oidcIssuerProfile.enabled + securityProfile.workloadIdentity.enabled + identityProfile.kubeletidentity"
    logic: oidcIssuerProfile.enabled != true OR securityProfile.workloadIdentity.enabled != true while a node/kubelet managed identity holds Azure role assignments and IMDS is reachable from pods (no NetworkPolicy blocking 169.254.169.254).
  attack_vector: Pod compromise -> steal node MI token via IMDS -> Azure resource access (chained)
  recommendation: Enable OIDC issuer and Entra Workload Identity; give each workload its own federated identity with least privilege; block pod egress to 169.254.169.254; minimize kubelet identity role assignments.
  controls:
    mitre: ["T1078.004", "T1552.007"]
    nist_csf: ["PR.AA-05", "PR.PS-01"]
  required_permissions: ["Reader"]

- check_id: CHK-COMP-CONTAINER-PRIVILEGED-INGRESS
  title: Container workload publicly exposed without ingress controls
  domain: container
  agent: aks-container
  mode: read-only
  severity_default: Medium
  description: A Container Apps / Container Instances workload exposes an external ingress to the internet with no IP restrictions or authentication in front of it.
  detection:
    method: resource-graph
    tool: "Microsoft.App/containerApps ingress + Microsoft.ContainerInstance/containerGroups ipAddress"
    logic: External ingress enabled with no ipSecurityRestrictions / auth, or a container group has a public IP with open ports.
  attack_vector: Internet-exposed container -> direct application attack / lateral movement
  recommendation: Restrict ingress to known sources, require authentication, prefer internal ingress + private networking.
  controls:
    mitre: ["T1190"]
  required_permissions: ["Reader"]

- check_id: CHK-COMP-ACR-ADMIN-USER
  title: Container Registry admin user enabled
  domain: container
  agent: aks-container
  mode: read-only
  severity_default: Medium
  description: ACR admin account is enabled, providing a shared credential instead of identity-based pull.
  detection:
    method: mcp-tool
    tool: "azure-acr registry properties adminUserEnabled"
    logic: adminUserEnabled == true.
  attack_vector: Shared registry credential theft -> image pull/push
  recommendation: Disable the admin user; use managed identity or token-based access.
  controls:
    mitre: ["T1552.001"]
  required_permissions: ["Reader"]

- check_id: CHK-COMP-ACR-PUBLIC-ANON
  title: Container Registry public network access or anonymous pull
  domain: container
  agent: aks-container
  mode: read-only
  severity_default: Medium
  description: An Azure Container Registry allows access from all networks and/or permits anonymous (unauthenticated) image pull, exposing images and their contents.
  detection:
    method: resource-graph
    tool: "Microsoft.ContainerRegistry/registries publicNetworkAccess + anonymousPullEnabled"
    logic: publicNetworkAccess == Enabled with no network rules, or anonymousPullEnabled == true.
  attack_vector: Anonymous/public registry -> image and secret disclosure, supply-chain tampering
  recommendation: Restrict public network access (private endpoint / network rules); disable anonymous pull.
  controls:
    mitre: ["T1525", "T1190"]
  required_permissions: ["Reader"]

- check_id: CHK-COMP-ACR-NO-DEFENDER-SCAN
  title: Container Registry image vulnerability scanning / Defender for Containers not enabled
  domain: container
  agent: aks-container
  mode: read-only
  severity_default: Medium
  description: Microsoft Defender for Containers (registry vulnerability assessment) is not enabled for the subscription, so images pushed to ACR are not continuously scanned for known CVEs, allowing vulnerable images to be promoted and deployed undetected.
  detection:
    method: azure-cli
    tool: "az security pricing show -n Containers + az security assessment list (registry scan results); az acr list for in-scope registries"
    logic: Defender for Containers pricing tier is Free/absent, or registries report no vulnerability-assessment coverage; optionally corroborate with an offline Trivy scan of pulled image digests.
  attack_vector: Unscanned image with critical CVE deployed -> exploitable workload / supply-chain foothold
  recommendation: Enable Defender for Containers (Standard tier) for registry and runtime scanning; gate promotion on scan results; remediate or quarantine images with critical/high findings.
  controls:
    mitre: ["T1525", "T1195"]
    nist_csf: ["PR.PS-01", "DE.CM-09"]
  required_permissions: ["Reader", "Security Reader"]

- check_id: CHK-COMP-ACR-NO-CONTENT-TRUST
  title: Container Registry content trust / quarantine not enabled
  domain: container
  agent: aks-container
  mode: read-only
  severity_default: Medium
  description: The registry does not enforce content trust (image signing) or quarantine, so unsigned or unscanned images can be pulled and run, leaving no integrity guarantee and enabling image tampering or implant of malicious images.
  detection:
    method: azure-cli
    tool: "az acr config content-trust show + az acr show policies (quarantinePolicy, trustPolicy); az acr repository show-tags for mutable tags"
    logic: trustPolicy.status != enabled, or quarantinePolicy.status != enabled, or tags are mutable (no immutability) on a Premium registry.
  attack_vector: Unsigned/tampered image pulled -> implant internal image -> compromised workload
  recommendation: Enable content trust and quarantine on a Premium registry; require signed images (Notation/Cosign) via admission policy; enable tag immutability and lock critical repositories.
  controls:
    mitre: ["T1554", "T1525", "T1195"]
    nist_csf: ["PR.PS-01", "GV.SC-06"]
  required_permissions: ["Reader"]

- check_id: CHK-COMP-CONTAINER-IMAGE-VULN
  title: Deployed container images with known critical/high vulnerabilities
  domain: container
  agent: aks-container
  mode: read-only
  severity_default: High
  description: Images currently referenced by AKS workloads, Container Apps, or Container Instances carry known critical/high CVEs (per Defender for Containers assessments or an offline registry scan), or are pinned to mutable :latest tags that mask drift, exposing running workloads to exploitable vulnerabilities.
  detection:
    method: azure-cli
    tool: "az security assessment list (container image findings) + kubectl get pods -A -o jsonpath images (read-only); optional Trivy on pulled digests"
    logic: A referenced image digest maps to a Defender/Trivy finding of CRITICAL/HIGH severity, or a workload references a mutable tag (e.g. :latest) instead of a digest.
  attack_vector: Exploit known CVE in running image -> code execution -> container escape / lateral movement
  recommendation: Rebuild/patch affected images, pin to digests, rescan, and redeploy; block deployment of images with critical findings via admission control; enforce continuous (not just build-time) scanning.
  controls:
    mitre: ["T1190", "T1610", "T1195"]
    nist_csf: ["PR.PS-01", "ID.RA-01"]
  required_permissions: ["Reader", "Security Reader"]

# ============================================================
# Lane 1 — new read-only posture-depth checks (CHK-CNTR-*)
# ============================================================

- check_id: CHK-CNTR-NO-CSI-SECRETS
  title: AKS not sourcing secrets via the Secrets Store CSI driver / Key Vault
  domain: container
  agent: aks-container
  mode: read-only
  severity_default: Medium
  description: The cluster does not enable the Azure Key Vault provider for the Secrets Store CSI driver, so workloads are likely sourcing secrets from plaintext Kubernetes Secrets, manifests, or environment variables rather than from Key Vault with short-lived, rotated, identity-bound access.
  detection:
    method: resource-graph
    tool: "managedClusters addonProfiles.azureKeyvaultSecretsProvider + securityProfile.azureKeyVaultKms"
    logic: addonProfiles.azureKeyvaultSecretsProvider.enabled != true (and no equivalent external secrets operator), indicating secrets are not brokered through Key Vault.
  attack_vector: Plaintext Kubernetes Secret / env var -> secret theft from a compromised pod or etcd read
  recommendation: Enable the Azure Key Vault provider for Secrets Store CSI driver, bind it to a workload identity with least privilege, enable secret auto-rotation, and remove plaintext secrets from manifests/env.
  controls:
    mitre: ["T1552.007", "T1552.001"]
    nist_csf: ["PR.AA-05", "PR.PS-01"]
  required_permissions: ["Reader"]

- check_id: CHK-CNTR-NO-IMAGE-INTEGRITY
  title: AKS deployment admission / image-integrity control not enforced
  domain: container
  agent: aks-container
  mode: read-only
  severity_default: Medium
  description: The cluster has no deployment-time admission control governing what images may run (Azure Policy for AKS / Gatekeeper, image cleaner, or signed-image verification), so unvetted, unsigned, or vulnerable images can be deployed without a gate.
  detection:
    method: resource-graph
    tool: "managedClusters addonProfiles.azurepolicy + securityProfile.imageCleaner + Azure Policy assignments for AKS"
    logic: addonProfiles.azurepolicy.enabled != true and no equivalent admission controller (Gatekeeper/Ratify/Kyverno) is present, or securityProfile.imageCleaner.enabled != true on a cluster pulling external images.
  attack_vector: No deploy gate -> unsigned/vulnerable image runs -> supply-chain foothold
  recommendation: Enable Azure Policy for AKS with Pod Security and image-source baselines; require signed images (Notation/Ratify) via admission; enable Image Cleaner to evict vulnerable cached images.
  controls:
    mitre: ["T1610", "T1525", "T1195"]
    nist_csf: ["PR.PS-01", "GV.SC-06"]
  required_permissions: ["Reader"]

# ============================================================
# Lane 2 — cluster-active (HARD-GATED, off by default)
# Runs ONLY under engagement mode cluster-active-testing with an enabled,
# authorized cluster_testing block, scope-locked to the Azure-derived cluster
# allowlist and enforced fail-closed by the cluster guardrail.
# ============================================================

- check_id: CHK-CNTR-KUBE-BENCH-CIS
  title: CIS Kubernetes / AKS benchmark failures on a live cluster
  domain: container
  agent: aks-container
  mode: cluster-active
  tier: cluster-benchmark
  severity_default: Medium
  description: A live, in-scope AKS cluster fails CIS Kubernetes / AKS benchmark controls (kubelet config, API server flags, RBAC, etcd, audit) as measured by kube-bench, indicating hardening gaps beyond what the control plane reports.
  detection:
    method: container-scan
    tool: "kube-bench (run via tools/cluster/Invoke-ScopedClusterScan.ps1; read-only API + node checks)"
    logic: kube-bench reports one or more FAIL/WARN controls in the master, etcd, control-plane, or node sections against an allowlisted cluster.
  attack_vector: Unhardened kubelet/API server control -> privilege escalation, audit blind spots
  recommendation: Remediate failing CIS controls (kubelet authn/authz, anonymous-auth off, audit logging, RBAC least privilege); track against the AKS security baseline.
  controls:
    cis_azure: ["8.x"]
    mitre: ["T1610", "T1078.004"]
    nist_csf: ["PR.PS-01", "ID.RA-01"]
  required_permissions: ["Reader", "Microsoft.ContainerService/managedClusters/listClusterUserCredential/action (read kubeconfig)"]

- check_id: CHK-CNTR-MANIFEST-RISK
  title: High-risk workload manifests on a live cluster (kubesec score)
  domain: container
  agent: aks-container
  mode: cluster-active
  tier: cluster-benchmark
  severity_default: Medium
  description: Workload manifests pulled read-only from a live, in-scope cluster score as high-risk (privileged, hostPID/hostNetwork/hostIPC, writable root filesystem, added dangerous capabilities, no resource limits, automountServiceAccountToken) as measured by kubesec.
  detection:
    method: container-scan
    tool: "kubectl get deploy/sts/ds -A -o yaml (read-only) | kubesec scan (via tools/cluster/Invoke-ScopedClusterScan.ps1)"
    logic: kubesec returns a negative/low score (e.g. critical points for privileged, hostNetwork, CAP_SYS_ADMIN, readOnlyRootFilesystem=false) for an in-scope workload manifest.
  attack_vector: Over-privileged pod spec -> container escape / node compromise
  recommendation: Set readOnlyRootFilesystem, drop ALL capabilities, runAsNonRoot, no host namespaces, resource limits, and automountServiceAccountToken=false unless required; enforce via Pod Security / Azure Policy.
  controls:
    mitre: ["T1610", "T1611", "T1525"]
    nist_csf: ["PR.PS-01", "PR.PS-05"]
  required_permissions: ["Reader", "Microsoft.ContainerService/managedClusters/listClusterUserCredential/action (read kubeconfig)"]

- check_id: CHK-CNTR-IMAGE-CVE-DEEP
  title: Deep image CVEs from offline scanning of pulled ACR images
  domain: container
  agent: aks-container
  mode: cluster-active
  tier: image-scan
  severity_default: High
  description: Container images pulled from in-scope ACR (or referenced by in-scope workloads) carry critical/high CVEs when scanned offline with trivy/grype, surfacing OS-package and language-dependency vulnerabilities beyond what Defender for Containers reports.
  detection:
    method: container-scan
    tool: "trivy image / grype (offline, on images pulled from allowlisted ACR via tools/cluster/Invoke-ScopedClusterScan.ps1)"
    logic: trivy/grype reports one or more CRITICAL/HIGH fixed-version CVEs in an in-scope image digest, or the image uses a mutable tag rather than a digest.
  attack_vector: Exploit known CVE in a running image -> code execution -> container escape / lateral movement
  recommendation: Rebuild/patch affected images, pin workloads to digests, rescan, and gate deployment on offline scan results in CI as well as at runtime.
  controls:
    mitre: ["T1190", "T1610", "T1195"]
    nist_csf: ["PR.PS-01", "ID.RA-01"]
  required_permissions: ["Reader", "AcrPull (or listClusterUserCredential to enumerate referenced images)"]

- check_id: CHK-CNTR-SA-TOKEN-REACH
  title: Over-broad or reachable ServiceAccount token inside a running pod
  domain: container
  agent: aks-container
  mode: cluster-active
  tier: runtime-probe
  severity_default: High
  description: From inside an in-scope running pod (via a benign read-only ephemeral debug container), a mounted ServiceAccount token is present and the bound ServiceAccount can perform privileged Kubernetes actions (e.g. create pods, read secrets cluster-wide, escalate), confirming a real in-cluster privilege-escalation path.
  detection:
    method: container-scan
    tool: "kubectl auth can-i --list --as=system:serviceaccount:<ns>:<sa> (read-only) + ephemeral debug container token-mount inventory"
    logic: A pod automounts a ServiceAccount token AND `auth can-i --list` for that SA returns privileged verbs/resources (create pods, get/list secrets in other namespaces, bind ClusterRoles, impersonate).
  attack_vector: Pod compromise -> reuse SA token -> in-cluster privilege escalation / secret theft
  recommendation: Set automountServiceAccountToken=false where unused; scope SA RBAC to least privilege (no cross-namespace secret reads, no pod-create/impersonate); use short-lived projected tokens with audiences.
  controls:
    mitre: ["T1528", "T1098.006", "T1613"]
    nist_csf: ["PR.AA-05", "PR.IR-01"]
  required_permissions: ["Reader", "Microsoft.ContainerService/managedClusters/listClusterUserCredential/action (read kubeconfig)"]

- check_id: CHK-CNTR-RUNTIME-INVENTORY
  title: In-pod runtime inventory reveals vulnerable packages or exposed secrets
  domain: container
  agent: aks-container
  mode: cluster-active
  tier: runtime-probe
  severity_default: High
  description: A benign, read-only inventory taken inside an in-scope running pod (via an ephemeral debug container) reveals exploitable conditions the control plane cannot see — vulnerable installed packages, unexpected listening processes, world-writable sensitive paths, or secret-shaped files on the container filesystem.
  detection:
    method: container-scan
    tool: "ephemeral debug container: read-only `ps`, package DB read, trivy filesystem scan, world-writable/secret-file inventory (via tools/cluster/Invoke-ScopedClusterScan.ps1)"
    logic: The in-pod inventory finds a vulnerable installed package (critical/high CVE), an unexpected listening service, a world-writable sensitive path, or a secret-shaped file in the container filesystem. Read-only; the ephemeral container is removed after use.
  attack_vector: Vulnerable in-container component / leaked secret -> exploitation -> escape / credential theft
  recommendation: Use minimal/distroless base images, run read-only root filesystems, remove embedded secrets (source from Key Vault via CSI), and patch in-image packages; redeploy from a clean, scanned image.
  controls:
    mitre: ["T1610", "T1552.001", "T1190"]
    nist_csf: ["PR.PS-01", "PR.PS-05", "ID.RA-01"]
  required_permissions: ["Reader", "Microsoft.ContainerService/managedClusters/listClusterUserCredential/action (read kubeconfig)"]
