# Identity Security Checks
# Executed by the Identity Posture Agent. Conforms to schemas/check.schema.json.

- check_id: CHK-IDEN-GA-NO-MFA
  title: Global Administrator without MFA enforced
  domain: identity
  agent: identity-posture
  mode: read-only
  severity_default: Critical
  description: A Global Administrator account is not protected by multi-factor authentication, allowing full tenant compromise from a single stolen credential.
  detection:
    method: msgraph
    tool: "GET /directoryRoles + /users/{id}/authentication/methods; cross-ref CA policies"
    logic: Principal in Global Administrator role with no MFA method registered or no CA policy enforcing MFA.
  attack_vector: Credential theft (phishing/spray) -> full tenant takeover
  recommendation: Enforce phishing-resistant MFA for all privileged roles via Conditional Access; prefer PIM-eligible activation.
  controls:
    cis_azure: ["1.1.1", "1.2.1"]
    mitre: ["T1078.004", "T1556"]
  required_permissions: ["Directory.Read.All"]

- check_id: CHK-IDEN-LEGACY-AUTH
  title: Legacy authentication protocols permitted
  domain: identity
  agent: identity-posture
  mode: read-only
  severity_default: High
  description: Legacy auth (basic auth, IMAP/POP/SMTP/MAPI) bypasses Conditional Access and MFA.
  detection:
    method: msgraph
    tool: "Conditional Access policies + sign-in logs for legacy clientAppUsed"
    logic: No CA policy blocks legacy authentication, or sign-in logs show successful legacy auth.
  attack_vector: Password spray against legacy endpoints bypasses MFA
  recommendation: Create a Conditional Access policy blocking legacy authentication for all users.
  controls:
    cis_azure: ["1.1.4"]
    mitre: ["T1110.003", "T1556"]
  required_permissions: ["Policy.Read.All"]

- check_id: CHK-IDEN-APP-OVERPRIV-GRAPH
  title: App registration with high-privilege Graph permissions
  domain: identity
  agent: identity-posture
  mode: read-only
  severity_default: High
  description: An application holds tenant-wide Graph permissions such as Directory.ReadWrite.All or RoleManagement.ReadWrite.Directory.
  detection:
    method: msgraph
    tool: "GET /servicePrincipals/{id}/appRoleAssignments"
    logic: Service principal granted high-risk application permissions, especially with a usable credential.
  attack_vector: Compromised app credential -> directory modification / privilege escalation
  recommendation: Remove unnecessary Graph permissions; use least privilege and delegated permissions where possible.
  controls:
    mitre: ["T1098.001", "T1078.004"]
  required_permissions: ["Application.Read.All"]

- check_id: CHK-IDEN-STALE-APP-SECRET
  title: App registration credential expired or excessively long-lived
  domain: identity
  agent: identity-posture
  mode: read-only
  severity_default: Medium
  description: Application has client secrets/certificates that are long-lived, unrotated, or whose presence indicates weak credential hygiene.
  detection:
    method: msgraph
    tool: "GET /applications -> passwordCredentials/keyCredentials"
    logic: Credential endDateTime > 1 year from start, or multiple active credentials, or credentials added by non-admins.
  attack_vector: Leaked long-lived secret grants persistent app access
  recommendation: Rotate to short-lived credentials or workload identity federation; remove unused credentials.
  controls:
    cis_azure: ["1.4"]
    mitre: ["T1552.001"]
  required_permissions: ["Application.Read.All"]

- check_id: CHK-IDEN-GUEST-PRIVILEGED
  title: Guest user holds a privileged directory role
  domain: identity
  agent: identity-posture
  mode: read-only
  severity_default: High
  description: An external guest account is assigned a privileged Entra role.
  detection:
    method: msgraph
    tool: "GET /directoryRoles/{id}/members filtered to userType == Guest"
    logic: Member of a privileged role has userType Guest.
  attack_vector: External account compromise -> privileged tenant access
  recommendation: Remove privileged roles from guests; if required, use PIM with strict review.
  controls:
    mitre: ["T1078.004"]
  required_permissions: ["Directory.Read.All"]

- check_id: CHK-IDEN-NO-CA-POLICY
  title: No Conditional Access policy enforcing MFA for users
  domain: identity
  agent: identity-posture
  mode: read-only
  severity_default: High
  description: The tenant lacks an effective Conditional Access policy requiring MFA, or relevant policies are report-only.
  detection:
    method: msgraph
    tool: "GET /identity/conditionalAccess/policies"
    logic: No enabled policy requires MFA for the target user population, or key policies stuck in reportOnly.
  attack_vector: Password-only sign-in succeeds without second factor
  recommendation: Enable a baseline CA policy requiring MFA for all users; graduate report-only policies to enabled.
  controls:
    cis_azure: ["1.1.1"]
    mitre: ["T1556"]
  required_permissions: ["Policy.Read.All"]

- check_id: CHK-IDEN-EXCESS-GLOBAL-ADMINS
  title: Excessive number of Global Administrators
  domain: identity
  agent: identity-posture
  mode: read-only
  severity_default: Medium
  description: More Global Administrators than necessary increases the privileged attack surface.
  detection:
    method: msgraph
    tool: "GET /directoryRoles -> Global Administrator members count"
    logic: Global Administrator member count exceeds 4 (excluding documented break-glass).
  attack_vector: Larger privileged surface = more credential-theft opportunities
  recommendation: Reduce to the minimum (2-4); use PIM-eligible assignments and least-privilege roles.
  controls:
    cis_azure: ["1.1.3"]
    mitre: ["T1078.004"]
  required_permissions: ["Directory.Read.All"]

- check_id: CHK-IDEN-ILLICIT-OAUTH-CONSENT
  title: Over-permissive or illicit OAuth application consent grant
  domain: identity
  agent: identity-posture
  mode: read-only
  severity_default: High
  description: An OAuth application holds delegated permission grants for high-impact scopes (e.g. Mail.Read, Mail.ReadWrite, Files.ReadWrite.All, offline_access), often consented tenant-wide (AllPrincipals) or to an app from an unverified publisher - the hallmark of an illicit consent grant (consent phishing) attack.
  detection:
    method: msgraph
    tool: "GET /oauth2PermissionGrants + /servicePrincipals; GET /auditLogs/directoryAudits?$filter=activityDisplayName eq 'Consent to application'"
    logic: A delegated permission grant covers high-risk scopes and is either consentType AllPrincipals (admin/tenant-wide) or granted to a service principal whose app has an unverified publisher or recent creation.
  attack_vector: Consent phishing -> attacker app receives a refresh token to read mail/files without a password and without re-triggering MFA
  recommendation: Require admin consent for apps; restrict user consent to verified publishers and low-risk scopes; review and revoke unrecognized grants.
  controls:
    mitre: ["T1528", "T1550.001", "T1566.002"]
    nist_csf: ["PR.AA-05", "GV.SC-04", "DE.CM-09"]
  required_permissions: ["Directory.Read.All", "Application.Read.All", "AuditLog.Read.All"]

- check_id: CHK-IDEN-SP-EXTRA-CREDENTIAL
  title: Enterprise service principal carries its own client credentials
  domain: identity
  agent: identity-posture
  mode: read-only
  severity_default: High
  description: A service principal object has client secrets or certificates attached, which - especially when added recently or on a privileged enterprise app - is a common service-principal-abuse persistence primitive (additional cloud credentials).
  detection:
    method: msgraph
    tool: "GET /servicePrincipals -> passwordCredentials/keyCredentials (metadata only)"
    logic: Service principal has one or more passwordCredentials/keyCredentials, particularly with a recent keyId/startDateTime or on an SP that also holds privileged app roles or a directory role.
  attack_vector: Attacker adds a secret to an existing privileged SP -> persistent app-only access that survives user password resets
  recommendation: Prefer workload identity federation over SP secrets; remove unused SP credentials; alert on credential additions via audit logs.
  controls:
    mitre: ["T1098.001", "T1078.004"]
    nist_csf: ["PR.AA-01", "DE.CM-09"]
  required_permissions: ["Application.Read.All"]

- check_id: CHK-IDEN-APP-OWNER-NONADMIN
  title: Privileged application or service principal owned by a non-admin
  domain: identity
  agent: identity-posture
  mode: read-only
  severity_default: High
  description: A standard (non-privileged) user is an owner of an application or service principal that holds high-privilege Graph permissions or a privileged directory role. Application ownership confers the ability to add credentials, creating a hidden privilege-escalation path.
  detection:
    method: msgraph
    tool: "GET /applications/{id}/owners + /servicePrincipals/{id}/owners"
    logic: An owner of a privileged app/SP is a non-admin user (not in a privileged directory role), granting de-facto credential-management control over that privileged identity.
  attack_vector: Compromise a low-privilege owner -> add an app credential -> authenticate as the privileged app
  recommendation: Restrict app/SP ownership to administrators; review owners of privileged apps; remove unnecessary owners.
  controls:
    mitre: ["T1098.001", "T1078.004"]
    nist_csf: ["PR.AA-01", "PR.AA-05"]
  required_permissions: ["Application.Read.All", "Directory.Read.All"]

- check_id: CHK-IDEN-PRIV-ROLE-STANDING
  title: Privileged directory role held as standing (non-PIM-eligible) access
  domain: identity
  agent: identity-posture
  mode: read-only
  severity_default: High
  description: A privileged Entra role (e.g. Global Administrator, Privileged Role Administrator, Application Administrator) is assigned permanently/active rather than as a PIM-eligible, just-in-time assignment, leaving always-on privilege that is not gated by activation, MFA, or approval.
  detection:
    method: msgraph
    tool: "GET /roleManagement/directory/roleAssignments (active) vs /roleManagement/directory/roleEligibilityScheduleInstances (eligible)"
    logic: A principal holds an active/permanent assignment to a privileged role with no corresponding eligible PIM schedule, beyond documented break-glass accounts.
  attack_vector: Standing admin privilege is an always-available target for credential theft - no JIT/MFA/approval barrier
  recommendation: Convert standing privileged assignments to PIM-eligible with activation MFA, justification, and approval; keep only 1-2 active break-glass accounts.
  controls:
    mitre: ["T1078.004", "T1098"]
    nist_csf: ["PR.AA-05", "PR.AA-02"]
  required_permissions: ["RoleManagement.Read.Directory", "Directory.Read.All"]

- check_id: CHK-IDEN-NO-PHISH-RESISTANT-MFA
  title: Phishing-resistant strong authentication not enforced for privileged roles
  domain: identity
  agent: identity-posture
  mode: read-only
  severity_default: Medium
  description: Privileged roles are not required to use phishing-resistant / passwordless methods (FIDO2, Windows Hello for Business, certificate-based). Phishable factors such as SMS and voice remain enabled and no Conditional Access authentication-strength policy enforces strong auth for admins.
  detection:
    method: msgraph
    tool: "GET /policies/authenticationMethodsPolicy + /identity/conditionalAccess/policies + /policies/authenticationStrengthPolicies"
    logic: SMS/voice methods are enabled tenant-wide and/or no enabled CA policy applies a phishing-resistant authentication strength to privileged-role users.
  attack_vector: Phishable MFA (SMS/voice/push) is bypassed by real-time phishing or MFA fatigue -> admin account takeover
  recommendation: Enable FIDO2/WHfB/passkeys; disable SMS and voice; enforce a phishing-resistant authentication-strength CA policy for all privileged roles.
  controls:
    mitre: ["T1078.004", "T1556", "T1621"]
    nist_csf: ["PR.AA-03", "PR.AA-02"]
  required_permissions: ["Policy.Read.All"]
