<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-label="Red team agent constellation: orchestrator dispatches eight domain specialists">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d14"/>
      <stop offset="1" stop-color="#160407"/>
    </linearGradient>
    <radialGradient id="acore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2b40" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7a0010" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="aglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2b40" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff2b40" stop-opacity="0"/>
    </radialGradient>
    <pattern id="agrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ff2b40" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="540" fill="url(#abg)"/>
  <rect width="1280" height="540" fill="url(#agrid)"/>
  <circle cx="640" cy="260" r="220" fill="url(#aglow)"/>

  <!-- dispatch links -->
  <g stroke="#ff5a5a" stroke-opacity="0.45" stroke-width="2">
    <line x1="640" y1="260" x2="640" y2="60"/>
    <line x1="640" y1="260" x2="810" y2="119"/>
    <line x1="640" y1="260" x2="880" y2="260"/>
    <line x1="640" y1="260" x2="810" y2="401"/>
    <line x1="640" y1="260" x2="640" y2="460"/>
    <line x1="640" y1="260" x2="470" y2="401"/>
    <line x1="640" y1="260" x2="400" y2="260"/>
    <line x1="640" y1="260" x2="470" y2="119"/>
  </g>

  <!-- specialist nodes -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#f5f7fa" text-anchor="middle">
    <g>
      <rect x="565" y="38" width="150" height="44" rx="11" fill="#15090c" stroke="#ff3b4d" stroke-width="1.6"/>
      <text x="640" y="65">Inventory &amp; Scope</text>
    </g>
    <g>
      <rect x="735" y="97" width="150" height="44" rx="11" fill="#15090c" stroke="#ff3b4d" stroke-width="1.6"/>
      <text x="810" y="124">Identity</text>
    </g>
    <g>
      <rect x="805" y="238" width="150" height="44" rx="11" fill="#15090c" stroke="#ff3b4d" stroke-width="1.6"/>
      <text x="880" y="265">Authorization</text>
    </g>
    <g>
      <rect x="735" y="379" width="150" height="44" rx="11" fill="#15090c" stroke="#ff3b4d" stroke-width="1.6"/>
      <text x="810" y="406">Network</text>
    </g>
    <g>
      <rect x="565" y="438" width="150" height="44" rx="11" fill="#15090c" stroke="#ff3b4d" stroke-width="1.6"/>
      <text x="640" y="465">Compute</text>
    </g>
    <g>
      <rect x="395" y="379" width="150" height="44" rx="11" fill="#15090c" stroke="#ff3b4d" stroke-width="1.6"/>
      <text x="470" y="406">Data</text>
    </g>
    <g>
      <rect x="325" y="238" width="150" height="44" rx="11" fill="#15090c" stroke="#ff3b4d" stroke-width="1.6"/>
      <text x="400" y="265">Logging</text>
    </g>
    <g>
      <rect x="395" y="97" width="150" height="44" rx="11" fill="#15090c" stroke="#ff3b4d" stroke-width="1.6"/>
      <text x="470" y="124">Reporting</text>
    </g>
  </g>

  <!-- orchestrator core -->
  <g transform="translate(640,260)">
    <polygon points="70,0 35,61 -35,61 -70,0 -35,-61 35,-61" fill="url(#acore)" stroke="#ffd2d2" stroke-width="2"/>
    <polygon points="50,0 25,43 -25,43 -50,0 -25,-43 25,-43" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <text x="0" y="-4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff">ORCHESTRATOR</text>
    <text x="0" y="18" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#ffe0e0" letter-spacing="1">PENTEST MANAGER</text>
  </g>

  <!-- caption -->
  <text x="640" y="516" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#9fb3c8">
    The dispatch-only Orchestrator assigns each domain to its specialist — every query is read-only.
  </text>
</svg>
