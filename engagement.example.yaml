# ============================================================
# Engagement Scope Definition
# ============================================================
# Copy this file to engagement.yaml and fill in target details.
# engagement.yaml is gitignored — never commit real target data.
#
# Every agent validates operations against this scope before
# executing. Out-of-scope resources are skipped automatically.
# ============================================================

engagement:
  id: "example-2026-q2"
  name: "Contoso Azure Security Assessment"
  authorized_by: "ciso@contoso.com"
  start_date: "2026-06-01"
  end_date: "2026-06-30"

# Operating mode — controls what agents are allowed to do
# Options:
#   read-only-assessment   — enumerate and analyze only (DEFAULT, safest)
#   attack-path-analysis   — read-only + build attack path graphs
#   controlled-validation  — read + limited safe validation of findings
#   external-active-testing — UNLOCKS the External Vulnerability Agent (EVA).
#                             Sends REAL traffic to live, Azure-discovered
#                             endpoints. Requires the external_testing block
#                             below to be enabled AND authorized. Use only with
#                             written permission. See safety.md.
mode: read-only-assessment

# Target scope — agents ONLY operate within these boundaries
scope:
  tenant_id: "00000000-0000-0000-0000-000000000000"
  subscriptions:
    - id: "00000000-0000-0000-0000-000000000001"
      name: "Production"
      resource_groups:
        - "*"  # all resource groups, or list specific ones
  # Explicit exclusions override the above
  exclusions:
    subscriptions: []
    resource_groups: []
    resources:
      - "/subscriptions/.../resourceGroups/shared/providers/Microsoft.KeyVault/vaults/payroll-kv"

  # --- Large-estate scoping (optional) ----------------------------------
  # Bound the work BEFORE it runs. Biggest lever first. Filtering is applied
  # server-side in Azure Resource Graph. See knowledge/scaling.md.
  #
  # resource_types: ARM type allow-list. Trailing '/*' matches a whole
  #   provider. Omit/empty = all in-scope types.
  resource_types: []
    # - "microsoft.storage/storageaccounts"
    # - "microsoft.compute/*"
    # - "microsoft.keyvault/vaults"
  #
  # domains: assessment-domain allow-list (maps to the domain sub-agents).
  #   Target a few high-value domains across the whole estate and defer the
  #   long tail. Omit/empty = all domains.
  domains: []
    # - identity-posture
    # - authorization-attack-path
    # - data-protection
    # - network-exposure

# Scale controls for large deployments (thousands of resources / subscription).
# ARG-based checks always run a full server-side census; these knobs only bound
# the expensive per-resource (data-plane) tail. See knowledge/scaling.md.
scale:
  sample_per_type: 0        # 0 = full census; e.g. 50 = at most 50 of each type get per-resource checks
  max_resource_calls: 0     # 0 = unlimited; hard ceiling on total per-resource `az` calls
  time_budget_min: 0        # 0 = no soft time budget; e.g. 120 = prioritize highest-risk work within ~2h
  prioritize_exposed: true  # assess public/internet-facing/privileged/prod resources first within any budget
  concurrency: 8            # max concurrent per-resource `az` calls (keep under ARM/ARG throttling)
  max_arg_pages: 50         # safety cap on 1,000-row ARG pages per paged check before marking it partial

# What the agents are permitted and forbidden from doing
permissions:
  allowed_actions:
    - enumerate_resources
    - read_configurations
    - analyze_rbac
    - inspect_network_exposure
    - query_logs
    - read_policy_assignments
    - read_defender_recommendations
  forbidden_actions:
    - mutate_resources
    - create_credentials
    - modify_role_assignments
    - deploy_payloads
    - disable_logging
    - access_customer_data_contents
    - delete_resources

# ============================================================
# External Vulnerability Agent (EVA) — ACTIVE external testing
# ============================================================
# OFF BY DEFAULT. This is the ONLY agent that sends real traffic to
# live endpoints. It is governed by a fail-closed egress guardrail:
# EVA may ONLY touch hosts on the Azure-derived allowlist generated
# from your in-scope inventory (engagements/<session>/scope/external-targets.json).
# It can never reach a host that does not map to an in-scope Azure resource.
#
# To run ANY active tier, ALL of the following must be true:
#   1. mode: external-active-testing      (above)
#   2. external_testing.enabled: true     (below)
#   3. a fully populated authorization block (below)
#
# ⚠️  LEGAL: Active scanning of internet-facing systems may be illegal
#     without explicit written authorization from the asset owner. Only
#     test assets you own or are contractually authorized to test.
external_testing:
  enabled: false

  # Maximum intrusiveness EVA may use:
  #   safe-active        — benign GET/HEAD probes only (security headers, TLS/
  #                        ciphers, HTTP methods, cookie flags, CORS, exposed
  #                        paths). Uses the built-in, dependency-free prober.
  #   active-dast        — OSS scanners: nuclei / OWASP ZAP / nikto / whatweb /
  #                        testssl.sh (each scope-locked to the allowlist).
  #   exploit-validation — sqlmap + confirmed injection/XSS payloads. Most
  #                        intrusive; use only with explicit sign-off.
  tier: safe-active

  # Written authorization (rules of engagement). Required before any active tier.
  authorization:
    attested_by: ""            # name/email of the authorizer
    attestation_id: ""         # contract / change-ticket / RoE reference
    authorized_window_start: "" # ISO 8601, e.g. 2026-06-01T00:00:00Z
    authorized_window_end: ""   # ISO 8601, e.g. 2026-06-30T23:59:59Z
    target_confirmation: true  # require a human to confirm the allowlist first

  # Extended OFFLINE static analysis (SAST) of website code pulled from Azure
  # (App Service Kudu / Storage $web). Sends NO traffic to the target. Separate
  # gate from live testing.
  static_analysis:
    enabled: false

  # Intensity caps so testing cannot impact production availability.
  limits:
    max_requests_per_host: 200
    rate_per_second: 5
    concurrency: 4

  # Which OSS scanners EVA may orchestrate when present on PATH (still
  # scope-locked). Tools not installed are simply skipped.
  tools:
    nuclei: true
    zap: true
    sqlmap: false
    testssl: true
    nikto: true
    whatweb: true
    semgrep: false

# Data handling controls
data_handling:
  redact_secrets: true
  redact_user_principal_names: false
  redact_tenant_ids: false
  store_raw_evidence: true
  max_evidence_retention_days: 90

# Caller identity for preflight validation
caller:
  identity_type: "user"  # user | service-principal | managed-identity
  required_roles:
    - "Reader"
    - "Security Reader"
  optional_roles:
    - "Log Analytics Reader"
    - "Directory Reader"
    - "Key Vault Reader"
