# NIST Cybersecurity Framework (CSF) 2.0 — Control Mapping
# Maps red team checks to NIST CSF 2.0 Functions / Categories / Subcategories.
# Reference: NIST CSF 2.0 (February 2024). This is a working subset aligned to the
# checks in this repo, not the full framework. Subcategory IDs (e.g. PR.AA-01) are the
# values used in each check's `controls.nist_csf` array.
#
# Several checks and their CSF subcategory tags were informed by the Apache-2.0
# "Anthropic-Cybersecurity-Skills" project (see THIRD_PARTY_NOTICES.md).

functions:
  - function: GOVERN (GV)
    description: Establish and monitor the organization's cybersecurity risk management strategy, expectations, and policy.
    categories:
      - id: GV.OC
        name: Organizational Context
        subcategories:
          - id: GV.OC-01
            title: Organizational mission and risk context understood
            checks: [CHK-GOV-MG-HIERARCHY-GUARDRAILS]
      - id: GV.RM
        name: Risk Management Strategy
        subcategories:
          - id: GV.RM-01
            title: Risk management objectives established and agreed
            checks: [CHK-GOV-SECURE-SCORE-LOW]
      - id: GV.PO
        name: Policy
        subcategories:
          - id: GV.PO-01
            title: Cybersecurity policy established and communicated
            checks: [CHK-GOV-POLICY-COVERAGE, CHK-GOV-POLICY-EXEMPTIONS]
      - id: GV.SC
        name: Cybersecurity Supply Chain Risk Management
        subcategories:
          - id: GV.SC-04
            title: Suppliers and third-party trust relationships known and prioritized
            checks: [CHK-SUP-APP-FIC-BROAD-TRUST, CHK-SUP-UAMI-FIC-BROAD-TRUST, CHK-SUP-CICD-SP-BROAD-ROLE]
          - id: GV.SC-06
            title: Pre-engagement due diligence on supply chain identities
            checks: [CHK-SUP-DEPLOY-IDENTITY-STATIC-SECRET, CHK-SUP-ACR-ADMIN-OR-UNTRUSTED-TASK]

  - function: IDENTIFY (ID)
    description: Understand the organization's assets, suppliers, and related cybersecurity risks.
    categories:
      - id: ID.AM
        name: Asset Management
        subcategories:
          - id: ID.AM-01
            title: Inventories of hardware/services managed
            checks: [CHK-EASM-UNKNOWN-ASSET, CHK-EASM-PUBLIC-IP-UNUSED, CHK-NET-PUBLIC-IP-UNEXPECTED]
          - id: ID.AM-03
            title: Network communication and data flows mapped
            checks: [CHK-NET-PEERING-CROSS-ENV, CHK-EASM-DANGLING-DNS, CHK-NET-DANGLING-DNS]
      - id: ID.RA
        name: Risk Assessment
        subcategories:
          - id: ID.RA-01
            title: Vulnerabilities in assets identified and recorded
            checks: [CHK-EASM-PUBLIC-MGMT-PORT, CHK-EVA-001, CHK-EVA-002, CHK-EVA-003]
          - id: ID.RA-05
            title: Threats, vulnerabilities, likelihood, and impact used to prioritize risk
            checks: [CHK-GOV-SECURE-SCORE-LOW]

  - function: PROTECT (PR)
    description: Use safeguards to manage the organization's cybersecurity risks.
    categories:
      - id: PR.AA
        name: Identity Management, Authentication, and Access Control
        subcategories:
          - id: PR.AA-01
            title: Identities and credentials managed
            checks: [CHK-IDEN-STALE-APP-SECRET, CHK-IDEN-APP-OVERPRIV-GRAPH]
          - id: PR.AA-02
            title: Identities proofed and bound to credentials
            checks: [CHK-IDEN-GUEST-PRIVILEGED]
          - id: PR.AA-03
            title: Users, services, and hardware authenticated
            checks: [CHK-IDEN-GA-NO-MFA, CHK-IDEN-LEGACY-AUTH, CHK-IDEN-NO-CA-POLICY]
          - id: PR.AA-05
            title: Access permissions and authorizations managed (least privilege)
            checks: [CHK-IDEN-EXCESS-GLOBAL-ADMINS, CHK-RBAC-SUB-OWNER-SPRAWL, CHK-RBAC-WILDCARD-ACTION, CHK-RBAC-CUSTOM-ROLE-ASSIGN-WRITE, CHK-RBAC-CLASSIC-ADMIN, CHK-RBAC-SP-PRIVILEGED, CHK-RBAC-AKS-CLUSTER-ADMIN]
      - id: PR.DS
        name: Data Security
        subcategories:
          - id: PR.DS-01
            title: Data-at-rest protected
            checks: [CHK-DB-SQL-NO-TDE, CHK-COMP-VM-NO-DISK-ENCRYPTION, CHK-STOR-KV-NO-PURGE-PROTECTION]
          - id: PR.DS-02
            title: Data-in-transit protected
            checks: [CHK-STOR-NO-HTTPS-ONLY, CHK-WEB-TLS-WEAK, CHK-MAIL-SPF-MISSING-OR-WEAK, CHK-MAIL-DMARC-MISSING-OR-NONE, CHK-MAIL-DKIM-NOT-ENABLED]
          - id: PR.DS-10
            title: Confidentiality of data managed (public exposure prevented)
            checks: [CHK-STOR-PUBLIC-BLOB, CHK-STOR-ANON-CONTAINER, CHK-STOR-PUBLIC-NETWORK, CHK-DB-SQL-PUBLIC-NETWORK, CHK-DB-COSMOS-PUBLIC-FIREWALL, CHK-DB-FLEX-PUBLIC-ACCESS, CHK-AI-OPENAI-PUBLIC, CHK-AI-AML-PUBLIC-WORKSPACE]
      - id: PR.PS
        name: Platform Security
        subcategories:
          - id: PR.PS-01
            title: Configuration management practices established
            checks: [CHK-COMP-APPSVC-FTP-DEBUG, CHK-COMP-APPSVC-NO-AUTH, CHK-COMP-ACR-ADMIN-USER, CHK-COMP-ACR-PUBLIC-ANON, CHK-AI-OPENAI-LOCALAUTH, CHK-AI-OPENAI-NO-CONTENT-FILTER]
          - id: PR.PS-05
            title: Installation and execution of unauthorized software prevented
            checks: [CHK-COMP-CONTAINER-PRIVILEGED-INGRESS, CHK-COMP-VM-PUBLIC-RUNCOMMAND]
      - id: PR.IR
        name: Technology Infrastructure Resilience
        subcategories:
          - id: PR.IR-01
            title: Networks and environments protected from unauthorized access
            checks: [CHK-NET-MGMT-PORT-INTERNET, CHK-NET-DB-PORT-INTERNET, CHK-NET-ANY-ANY-RULE, CHK-NET-SUBNET-NO-NSG, CHK-COMP-AKS-PUBLIC-API, CHK-COMP-AKS-NO-NETPOL, CHK-WEB-FRONTDOOR-NO-WAF, CHK-WEB-APPGW-NO-WAF, CHK-WEB-APIM-OPEN-GATEWAY, CHK-WEB-ORIGIN-DIRECT-REACH]

  - function: DETECT (DE)
    description: Find and analyze possible cybersecurity attacks and compromises.
    categories:
      - id: DE.CM
        name: Continuous Monitoring
        subcategories:
          - id: DE.CM-01
            title: Networks and network services monitored
            checks: [CHK-LOG-NO-NSG-FLOW, CHK-LOG-NO-DIAG-CRITICAL]
          - id: DE.CM-03
            title: Personnel activity and technology usage monitored
            checks: [CHK-LOG-NO-ACTIVITY-EXPORT, CHK-LOG-NO-ALERT-ROLE-ASSIGN]
          - id: DE.CM-06
            title: External service provider activities monitored
            checks: [CHK-LOG-NO-DIAG-KEYVAULT, CHK-DB-SQL-NO-AUDIT]
          - id: DE.CM-09
            title: Computing hardware/software and runtime environments monitored
            checks: [CHK-LOG-DEFENDER-DISABLED, CHK-LOG-NO-SENTINEL-IDENTITY, CHK-MAIL-ANTIPHISH-WEAK, CHK-MAIL-SAFE-LINKS-ATTACH-OFF]

  - function: RESPOND (RS)
    description: Take action regarding a detected cybersecurity incident.
    categories:
      - id: RS.MA
        name: Incident Management
        subcategories:
          - id: RS.MA-01
            title: Incident response plan executed with monitoring coverage
            checks: [CHK-GOV-NO-SECURITY-CONTACT, CHK-LOG-NO-SENTINEL-IDENTITY]

  - function: RECOVER (RC)
    description: Restore assets and operations affected by a cybersecurity incident.
    categories:
      - id: RC.RP
        name: Incident Recovery Plan Execution
        subcategories:
          - id: RC.RP-01
            title: Recovery portion of the incident response plan supported by safeguards
            checks: [CHK-STOR-KV-NO-PURGE-PROTECTION, CHK-GOV-NO-RESOURCE-LOCKS]
