version: 1
project:
  title: Azure Red Team Agent Orchestration
  description: >-
    An agentic red team for Azure cloud security — a coordinated team of read-only
    AI agents that pentest your Azure environment and produce consulting-grade reports.
  github: https://github.com/Contoso-State/red-team-agent-orchestration
  thumbnail: assets/social-card.png
  error_rules:
    # Local methodology pages intentionally link to repo files (skills, agents,
    # checks) that aren't part of the rendered doc tree.
    - rule: link-resolves
      severity: ignore
  toc:
    - file: index.md
    - file: getting-started.md
    - file: agent-team.md
    - file: skills.md
    - file: methodology.md
    - file: datastore.md
    - file: reporting.md
    - url: https://contoso-state.github.io/red-team-agent-orchestration/report.sample.html
      title: Sample Report
    - file: safety.md
    - file: external-vuln.md
    - file: repository.md
site:
  template: book-theme
  title: Azure Red Team Agent Orchestration
  options:
    logo: assets/ninja-logo.svg
    logo_text: Azure Red Team
    favicon: assets/ninja-favicon.svg
    hide_outline: false
    style: assets/custom.css
  nav:
    - title: GitHub
      url: https://github.com/Contoso-State/red-team-agent-orchestration
