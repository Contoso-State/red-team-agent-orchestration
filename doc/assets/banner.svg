<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Azure Red Team Agent Orchestration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d14"/>
      <stop offset="0.55" stop-color="#120308"/>
      <stop offset="1" stop-color="#1c0406"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.16" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2b40" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2b40" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.92" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#2496ed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2496ed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a5a"/>
      <stop offset="1" stop-color="#e10600"/>
    </linearGradient>
    <linearGradient id="blueText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#50b0ff"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
    <linearGradient id="hexStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b4d"/>
      <stop offset="1" stop-color="#7a0010"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ff2b40" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <!-- ninja emblem gradients/filters -->
    <linearGradient id="nl-hood" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5bb6ff"/>
      <stop offset="0.5" stop-color="#1f8ae0"/>
      <stop offset="1" stop-color="#0a63bd"/>
    </linearGradient>
    <linearGradient id="nl-hoodHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe3ff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#bfe3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nl-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2845"/>
      <stop offset="1" stop-color="#041523"/>
    </linearGradient>
    <linearGradient id="nl-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f1fb"/>
      <stop offset="0.5" stop-color="#9fb4c8"/>
      <stop offset="1" stop-color="#5d7286"/>
    </linearGradient>
    <linearGradient id="nl-eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a86"/>
      <stop offset="1" stop-color="#e10600"/>
    </linearGradient>
    <linearGradient id="nl-hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1420"/>
      <stop offset="1" stop-color="#191f2b"/>
    </linearGradient>
    <linearGradient id="nl-tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a9bf0"/>
      <stop offset="1" stop-color="#0a63bd"/>
    </linearGradient>
    <radialGradient id="nl-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2b40" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2b40" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="nl-hoodClip">
      <path d="M128 62 C 163 62 186 91 186 124 C 186 161 159 202 128 202 C 97 202 70 161 70 124 C 70 91 93 62 128 62 Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glowRed)"/>
  <rect width="1200" height="320" fill="url(#glowBlue)"/>

  <!-- emblem: Azure-blue ninja in hexagon shield -->
  <g transform="translate(168,160) scale(0.9) translate(-128,-128)">
    <!-- hexagon shield -->
    <g transform="translate(128,128)">
      <polygon points="104,0 52,90 -52,90 -104,0 -52,-90 52,-90" fill="url(#nl-hex)" stroke="url(#hexStroke)" stroke-width="4"/>
      <polygon points="86,0 43,74 -43,74 -86,0 -43,-74 43,-74" fill="none" stroke="#ff2b40" stroke-opacity="0.4" stroke-width="1.5"/>
    </g>
    <!-- crossed katana behind the head -->
    <g>
      <g transform="translate(128,128) rotate(55)">
        <path d="M0 -96 L3.5 -86 L3.5 20 L-3.5 20 L-3.5 -86 Z" fill="url(#nl-steel)"/>
        <rect x="-11" y="20" width="22" height="6" rx="2" fill="#16202c"/>
        <rect x="-5" y="26" width="10" height="44" rx="3" fill="#0c141d"/>
        <rect x="-6" y="68" width="12" height="7" rx="2" fill="#16202c"/>
        <g stroke="#e10600" stroke-width="2" stroke-opacity="0.85">
          <line x1="-4.5" y1="34" x2="4.5" y2="38"/>
          <line x1="-4.5" y1="44" x2="4.5" y2="48"/>
          <line x1="-4.5" y1="54" x2="4.5" y2="58"/>
        </g>
      </g>
      <g transform="translate(128,128) rotate(-55)">
        <path d="M0 -96 L3.5 -86 L3.5 20 L-3.5 20 L-3.5 -86 Z" fill="url(#nl-steel)"/>
        <rect x="-11" y="20" width="22" height="6" rx="2" fill="#16202c"/>
        <rect x="-5" y="26" width="10" height="44" rx="3" fill="#0c141d"/>
        <rect x="-6" y="68" width="12" height="7" rx="2" fill="#16202c"/>
        <g stroke="#e10600" stroke-width="2" stroke-opacity="0.85">
          <line x1="-4.5" y1="34" x2="4.5" y2="38"/>
          <line x1="-4.5" y1="44" x2="4.5" y2="48"/>
          <line x1="-4.5" y1="54" x2="4.5" y2="58"/>
        </g>
      </g>
    </g>
    <!-- headband tails -->
    <g fill="url(#nl-tail)" stroke="#0a63bd" stroke-width="1" stroke-opacity="0.5">
      <path d="M172 112 C 204 104 222 116 240 106 C 224 124 204 122 184 128 Z"/>
      <path d="M176 132 C 206 134 222 145 242 142 C 221 153 199 149 182 144 Z"/>
    </g>
    <!-- ninja hood -->
    <path d="M128 62 C 163 62 186 91 186 124 C 186 161 159 202 128 202 C 97 202 70 161 70 124 C 70 91 93 62 128 62 Z" fill="url(#nl-hood)"/>
    <path d="M128 62 C 163 62 186 91 186 124 C 186 161 159 202 128 202 C 97 202 70 161 70 124 C 70 91 93 62 128 62 Z" fill="url(#nl-hoodHi)"/>
    <!-- mask band across the eyes -->
    <g clip-path="url(#nl-hoodClip)">
      <path d="M58 100 C 92 112 164 112 198 100 L 198 138 C 164 150 92 150 58 138 Z" fill="url(#nl-band)"/>
      <path d="M58 100 C 92 112 164 112 198 100" fill="none" stroke="#5bb6ff" stroke-opacity="0.5" stroke-width="1.5"/>
    </g>
    <!-- glowing red eyes -->
    <g>
      <ellipse cx="106" cy="122" rx="17" ry="9" fill="url(#nl-glow)" filter="url(#soft)"/>
      <ellipse cx="150" cy="122" rx="17" ry="9" fill="url(#nl-glow)" filter="url(#soft)"/>
      <g transform="translate(105,121) rotate(-15)">
        <rect x="-15" y="-5" width="30" height="10" rx="5" fill="url(#nl-eye)"/>
        <rect x="-15" y="-5" width="13" height="4" rx="2" fill="#ffd2d2" fill-opacity="0.85"/>
      </g>
      <g transform="translate(151,121) rotate(15)">
        <rect x="-15" y="-5" width="30" height="10" rx="5" fill="url(#nl-eye)"/>
        <rect x="2" y="-5" width="13" height="4" rx="2" fill="#ffd2d2" fill-opacity="0.85"/>
      </g>
    </g>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="320" y="138" font-size="62" font-weight="800" letter-spacing="1" fill="#f5f7fa"><tspan fill="url(#blueText)">AZURE</tspan> <tspan fill="url(#redText)">RED TEAM</tspan></text>
    <text x="322" y="186" font-size="30" font-weight="600" letter-spacing="6" fill="#9fb3c8">AGENT&#160;&#160;ORCHESTRATION</text>

    <!-- tagline pills -->
    <g font-size="15" font-weight="600" fill="#ffd2d2">
      <rect x="322" y="214" width="172" height="30" rx="15" fill="#ff2b40" fill-opacity="0.12" stroke="#ff2b40" stroke-opacity="0.45"/>
      <text x="408" y="234" text-anchor="middle">AUTONOMOUS</text>
      <rect x="506" y="214" width="158" height="30" rx="15" fill="#ff2b40" fill-opacity="0.12" stroke="#ff2b40" stroke-opacity="0.45"/>
      <text x="585" y="234" text-anchor="middle">READ-ONLY</text>
      <rect x="676" y="214" width="176" height="30" rx="15" fill="#2496ed" fill-opacity="0.12" stroke="#2496ed" stroke-opacity="0.5"/>
      <text x="764" y="234" text-anchor="middle" fill="#bfe0ff">AZURE-NATIVE</text>
    </g>
  </g>

  <!-- agent constellation accent (right) -->
  <g stroke="#ff2b40" stroke-opacity="0.35" stroke-width="1.2">
    <line x1="1040" y1="70" x2="1110" y2="120"/>
    <line x1="1110" y1="120" x2="1060" y2="190"/>
    <line x1="1060" y1="190" x2="1130" y2="240"/>
    <line x1="1110" y1="120" x2="1150" y2="70"/>
    <line x1="1040" y1="70" x2="1000" y2="150"/>
    <line x1="1000" y1="150" x2="1060" y2="190"/>
  </g>
  <g fill="#0a0d14" stroke="#ff5a5a" stroke-width="2">
    <circle cx="1040" cy="70" r="7"/>
    <circle cx="1110" cy="120" r="9" fill="#ff2b40" stroke="#ffd2d2"/>
    <circle cx="1060" cy="190" r="7"/>
    <circle cx="1130" cy="240" r="6"/>
    <circle cx="1150" cy="70" r="6"/>
    <circle cx="1000" cy="150" r="6"/>
  </g>

  <rect x="0" y="314" width="1200" height="6" fill="url(#redText)"/>
</svg>
