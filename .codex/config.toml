# .codex/config.toml — OpenAI Codex CLI posture for the Azure red team engagement.
#
# This file combines the Azure command guard, approval routing, and a local filesystem
# sandbox. These controls have different roles; approval routing and the filesystem
# sandbox do not themselves enforce Azure read-only permissions:
#
#   1. The lifecycle hook (.codex/hooks.json -> .codex/hooks/redteam-guard.mjs) blocks any
#      command that is not provably read-only (the same engine the Copilot/Claude/Cursor
#      adapters use). This is the primary, platform-neutral control.
#   2. approval_policy = "on-request" lets the model decide when to request approval.
#      It does not require approval before every generated command.
#   3. The sandbox keeps writes inside the workspace and protects .git/.codex/.agents.
#
# FIRST-RUN TRUST: Codex requires you to trust a newly discovered project hook before it
# runs. After cloning, start Codex in this repo and run `/hooks` (or accept the onboarding
# prompt) once to trust .codex/hooks/redteam-guard.mjs. Until trusted, the guard does not
# execute — so verify it is trusted before beginning an assessment.

# Allow model-requested approval. The trusted hook separately blocks non-read-only
# Azure/cluster commands. This setting does not promise a per-command approval prompt.
approval_policy = "on-request"

# Keep evidence/report writes inside the permitted local workspace. Outbound network
# is enabled below for Azure reads; the trusted guard and Azure account permissions,
# not this filesystem sandbox or approval policy, enforce the Azure boundary.
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# Allow outbound network so the read-only Azure data-plane/control-plane queries (az, az
# rest --method GET, Get-Az*, Microsoft Graph GET) work. The trusted guard separately
# refuses mutating assessment commands.
network_access = true

[features]
# Codex lifecycle hooks are stable and enabled by default; set explicitly so the read-only
# guard's requirement is self-documenting and survives any future default change.
hooks = true
